<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonIQ">
<meta name="theme-color" content="#0a0a0c">
<title>MonIQ — Personal Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0a0a0c;
    --bg-2: #0e0d10;
    --surface: #141318;
    --surface-2: #1b1a20;
    --gold: #c9a24b;
    --gold-bright: #e9cd82;
    --gold-dim: #7d6730;
    --hairline: rgba(201,162,75,0.22);
    --hairline-strong: rgba(201,162,75,0.45);
    --ivory: #f2ede2;
    --muted: #9c9587;
    --muted-2: #6d675c;
    --rust: #b45a3f;
    --rust-bright: #d17155;
    --sage: #7fa07d;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,162,75,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(201,162,75,0.04), transparent 55%),
      var(--bg);
    color:var(--ivory);
    font-family:'Jost', sans-serif;
    font-weight:300;
    min-height:100vh;
    letter-spacing:0.01em;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 90px;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  .topbar{background:#000; border:1px solid var(--hairline-strong); border-radius:14px;
    padding:26px 26px 20px; margin-bottom:26px; text-align:center;
    box-shadow: inset 0 0 40px rgba(201,162,75,0.06);}
  .brand{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .brand .mark{font-family:'Cormorant Garamond', serif; font-size:56px; color:var(--gold-bright); letter-spacing:0.1em; font-weight:700; text-transform:uppercase; text-shadow:0 0 22px rgba(233,205,130,0.25); line-height:1.1;}
  .brand .sub{font-size:11px; text-transform:uppercase; letter-spacing:0.28em; color:var(--muted-2);}
  .brand .tagline{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:16px; color:var(--gold); letter-spacing:0.03em; margin-top:8px;}
  .topbar .date{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); letter-spacing:0.03em; margin-top:12px;}
  @media (max-width:600px){ .brand .mark{font-size:36px;} }

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:2px; margin-bottom:26px; border:1px solid var(--hairline); border-radius:10px; overflow:hidden; background:var(--surface); width:fit-content; max-width:100%; flex-wrap:wrap;}
  .tab-btn{background:transparent; border:none; color:var(--muted); padding:11px 20px; font-family:'Jost'; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; transition:all .2s ease; border-right:1px solid var(--hairline);}
  .tab-btn:last-child{border-right:none;}
  .tab-btn:hover{color:var(--ivory); background:rgba(201,162,75,0.06);}
  .tab-btn.active{color:#0a0a0c; background:linear-gradient(180deg, var(--gold-bright), var(--gold)); font-weight:500;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:24px; box-shadow:var(--shadow); margin-bottom:22px;}
  .card h2{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:22px; color:var(--gold-bright); margin:0 0 4px; letter-spacing:0.02em;}
  .card .card-desc{font-size:12.5px; color:var(--muted); margin-bottom:18px;}
  .grid-2{display:grid; grid-template-columns:1.1fr 0.9fr; gap:20px;}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr;} }

  .hairline{border:none; border-top:1px solid var(--hairline); margin:18px 0;}

  /* ---------- Goal Hero ---------- */
  .goal-hero{display:flex; flex-direction:column; gap:6px;}
  .goal-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .goal-label{font-size:11px; text-transform:uppercase; letter-spacing:0.2em; color:var(--muted-2);}
  .goal-edit-inline{display:flex; align-items:center; gap:8px;}
  .goal-amount-display{font-family:'Cormorant Garamond', serif; font-size:44px; color:var(--gold-bright); font-weight:600; letter-spacing:0.01em;}
  .goal-amount-display span.of{font-size:20px; color:var(--muted); font-weight:400; margin:0 6px;}
  .pill-btn{background:transparent; border:1px solid var(--hairline-strong); color:var(--gold-bright); padding:6px 14px; border-radius:20px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all .2s;}
  .pill-btn:hover{background:rgba(201,162,75,0.12);}
  .pill-btn.solid{background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#0a0a0c; border:none; font-weight:500;}
  .pill-btn.solid:hover{filter:brightness(1.08);}
  .pill-btn.danger{border-color:rgba(180,90,63,0.5); color:var(--rust-bright);}
  .pill-btn.danger:hover{background:rgba(180,90,63,0.12);}

  .stat-row{display:flex; gap:28px; flex-wrap:wrap; margin-top:10px;}
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .v{font-family:'IBM Plex Mono', monospace; font-size:19px; color:var(--ivory);}
  .stat .l{font-size:10.5px; text-transform:uppercase; letter-spacing:0.16em; color:var(--muted-2);}
  .stat.pos .v{color:var(--sage);}
  .stat.neg .v{color:var(--rust-bright);}

  /* progress bar */
  .prog-wrap{margin-top:18px;}
  .prog-track{position:relative; height:30px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:6px; overflow:hidden;}
  .prog-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); border-radius:6px 0 0 6px; transition:width .6s cubic-bezier(.4,0,.2,1); position:relative;}
  .prog-fill::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.18), transparent 60%);}
  .prog-ticks{position:relative; height:14px; margin-top:4px;}
  .prog-tick{position:absolute; top:0; font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--muted-2); transform:translateX(-50%);}
  .prog-pct-label{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono', monospace; font-size:12px; color:#0a0a0c; font-weight:500; text-shadow:0 1px 0 rgba(255,255,255,0.2); z-index:2;}
  .prog-pct-label.outside{color:var(--gold-bright); text-shadow:none; right:-2px; transform:translate(100%,-50%);}
  .goal-motivation{text-align:center; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:16.5px; color:var(--gold-bright); margin-top:16px; letter-spacing:0.02em;}

  /* ---------- Forms ---------- */
  label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.14em; color:var(--muted-2); display:block; margin-bottom:5px;}
  input[type=text], input[type=number], input[type=date], input[type=month], select, textarea{
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--ivory); border-radius:7px; padding:9px 11px; font-family:'Jost'; font-size:14px; width:100%; outline:none; transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--gold);}
  input[type=number]{font-family:'IBM Plex Mono', monospace;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}

  .type-toggle{display:flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; width:fit-content;}
  .type-toggle button{background:var(--surface-2); border:none; color:var(--muted); padding:9px 22px; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;}
  .type-toggle button.active[data-type=income]{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#0a0a0c;}
  .type-toggle button.active[data-type=expense]{background:linear-gradient(180deg,var(--rust-bright),var(--rust)); color:#170a06;}

  .mic-btn{display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; border:1px solid var(--hairline-strong); background:var(--surface-2); color:var(--gold-bright); cursor:pointer; transition:all .2s; flex-shrink:0;}
  .mic-btn:hover{background:rgba(201,162,75,0.12);}
  .mic-btn.listening{background:linear-gradient(180deg,var(--rust-bright),var(--rust)); border-color:transparent; color:#170a06; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,90,63,0.5);} 70%{box-shadow:0 0 0 12px rgba(180,90,63,0);} 100%{box-shadow:0 0 0 0 rgba(180,90,63,0);}}
  .add-entry-row{display:flex; gap:14px; align-items:flex-end;}
  .add-entry-row .field{flex:1; margin-bottom:0;}

  .btn-primary{background:linear-gradient(180deg, var(--gold-bright), var(--gold)); border:none; color:#0a0a0c; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; font-size:12.5px; padding:11px 22px; border-radius:8px; cursor:pointer;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; border:1px solid var(--hairline); color:var(--muted); padding:11px 18px; border-radius:8px; cursor:pointer; font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;}
  .btn-ghost:hover{color:var(--ivory); border-color:var(--hairline-strong);}

  .voice-hint{font-size:11.5px; color:var(--muted-2); margin-top:8px; font-style:italic;}

  /* ---------- Category rows ---------- */
  .cat-section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
  .cat-section-title h3{font-family:'Cormorant Garamond', serif; font-size:18px; color:var(--gold-bright); margin:0; font-weight:600;}
  .cat-total{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--muted);}
  .cat-row{display:grid; grid-template-columns:1fr 130px 130px 90px 34px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline); position:relative;}
  .cat-row.head{border-bottom:1px solid var(--hairline-strong); padding-bottom:6px;}
  .cat-row.head span{font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color:var(--muted-2);}
  .cat-row input{padding:7px 9px; font-size:13px;}
  .cat-field{min-width:0;}
  .cat-label{display:none;}
  .voice-keywords-row{padding:0 0 12px; border-bottom:1px solid var(--hairline);}
  .voice-keywords-row input{font-size:12px; padding:6px 9px;}
  .cat-name-area{width:100%; resize:none; line-height:1.4; min-height:38px; font-family:'Jost'; overflow-wrap:break-word;}
  .cat-actual{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ivory); text-align:right; padding-right:6px;}
  .cat-actual.over{color:var(--rust-bright);}
  .flag{display:inline-block; background:rgba(180,90,63,0.18); color:var(--rust-bright); border:1px solid rgba(180,90,63,0.4); font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .del-row-btn{background:transparent; border:none; color:var(--muted-2); cursor:pointer; font-size:16px; width:30px; height:30px; border-radius:6px;}
  .del-row-btn:hover{color:var(--rust-bright); background:rgba(180,90,63,0.1);}

  /* ---- Portrait / narrow phones: stack category rows so nothing gets clipped ---- */
  @media (max-width:640px){
    .cat-row{grid-template-columns:1fr; gap:6px; padding:16px 34px 16px 0;}
    .cat-row.head{display:none;}
    .cat-label{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted-2); margin-bottom:4px;}
    .cat-actual{text-align:left; padding-right:0; font-size:14px;}
    .cat-row .del-row-btn{position:absolute; top:14px; right:0;}
  }

  .bill-row{display:grid; grid-template-columns:1fr 110px 90px 1fr 34px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline); position:relative;}
  .bill-row.head{border-bottom:1px solid var(--hairline-strong); padding-bottom:6px;}
  .bill-row.head span{font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color:var(--muted-2);}
  .bill-row input, .bill-row select{padding:7px 9px; font-size:13px;}
  .nw-row{display:grid; grid-template-columns:1fr 150px 34px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline); position:relative;}
  .nw-row input{padding:7px 9px; font-size:13px;}
  @media (max-width:640px){
    .bill-row{grid-template-columns:1fr; gap:6px; padding:16px 34px 16px 0;}
    .bill-row.head{display:none;}
    .bill-row .del-row-btn{position:absolute; top:14px; right:0;}
    .nw-row{grid-template-columns:1fr; gap:6px; padding:16px 34px 16px 0;}
    .nw-row .del-row-btn{position:absolute; top:14px; right:0;}
  }

  .month-select-bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .month-select-bar input[type=month]{width:auto;}

  /* ---------- Transactions list ---------- */
  .txn-list{max-height:420px; overflow-y:auto; margin-top:6px;}
  .txn-row{display:grid; grid-template-columns:88px 1fr 110px 30px; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--hairline); font-size:13px;}
  .txn-date{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted);}
  .txn-cat{color:var(--ivory);}
  .txn-cat .note{display:block; font-size:11px; color:var(--muted-2); font-style:italic;}
  .txn-amt{font-family:'IBM Plex Mono', monospace; text-align:right;}
  .txn-amt.income{color:var(--sage);}
  .txn-amt.expense{color:var(--rust-bright);}

  /* ---------- Summary table ---------- */
  table.summary{width:100%; border-collapse:collapse; font-size:13px;}
  table.summary th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted-2); padding:8px 6px; border-bottom:1px solid var(--hairline-strong);}
  table.summary td{padding:8px 6px; border-bottom:1px solid var(--hairline); font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  table.summary td.name{font-family:'Jost'; font-size:13px;}
  table.summary tr.section td{font-family:'Cormorant Garamond', serif; font-size:15px; color:var(--gold-bright); padding-top:16px; font-weight:600;}
  .num{text-align:right;}
  .over-text{color:var(--rust-bright);}
  .under-text{color:var(--sage);}

  /* ---------- Toast ---------- */
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); border:1px solid var(--hairline-strong); box-shadow:var(--shadow); border-radius:10px; padding:13px 18px; display:flex; align-items:center; gap:14px; opacity:0; pointer-events:none; transition:all .3s ease; z-index:999;}

  .onboard-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.82); display:flex; align-items:center; justify-content:center; z-index:1200; padding:20px; backdrop-filter:blur(2px);}
  .onboard-card{background:var(--surface); border:1px solid var(--hairline-strong); border-radius:16px; padding:36px 30px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.6);}
  .onboard-icon{font-size:36px; color:var(--gold-bright); margin-bottom:14px;}
  .onboard-title{font-family:'Cormorant Garamond', serif; font-size:26px; color:var(--gold-bright); font-weight:600; margin:0 0 12px;}
  .onboard-body{font-size:14px; color:var(--ivory); line-height:1.6; margin:0 0 22px;}
  .onboard-dots{display:flex; justify-content:center; gap:7px; margin-bottom:24px;}
  .onboard-dot{width:7px; height:7px; border-radius:50%; background:var(--hairline-strong);}
  .onboard-dot.active{background:var(--gold-bright); width:20px; border-radius:4px; transition:all .25s ease;}
  .onboard-actions{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .toast .msg{font-size:13px; color:var(--ivory);}
  .toast button{background:transparent; border:1px solid var(--hairline-strong); color:var(--gold-bright); padding:5px 12px; border-radius:6px; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; cursor:pointer;}

  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
  .legend-swatch{width:10px; height:10px; border-radius:2px; display:inline-block;}

  .empty-state{color:var(--muted-2); font-size:13px; font-style:italic; padding:20px 0; text-align:center;}
  .intro-feature-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:18px; margin-top:14px;}
  .intro-feature{background:var(--surface-2); border:1px solid var(--hairline); border-radius:12px; padding:20px;}
  .intro-feature-icon{font-size:22px; color:var(--gold-bright); margin-bottom:10px;}
  .intro-feature-title{font-family:'Cormorant Garamond', serif; font-size:17px; color:var(--gold-bright); font-weight:600; margin-bottom:6px;}
  .intro-feature-body{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .ai-chat-window{max-height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:4px 2px;}
  .ai-msg{max-width:88%;}
  .ai-msg.user{align-self:flex-end; text-align:right;}
  .ai-msg.assistant{align-self:flex-start;}
  .ai-msg-role{font-size:9.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted-2); margin-bottom:3px;}
  .ai-msg-body{background:var(--surface-2); border:1px solid var(--hairline); border-radius:10px; padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ivory); display:inline-block; text-align:left;}
  .ai-msg.user .ai-msg-body{background:linear-gradient(180deg, rgba(201,162,75,0.16), rgba(201,162,75,0.08)); border-color:var(--hairline-strong);}
  .voice-demo-clip{position:relative; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px 16px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:12px;}
  .voice-demo-mic{font-size:34px; animation:voiceMicPulse 1.2s ease-in-out infinite;}
  @keyframes voiceMicPulse{0%,100%{transform:scale(1); opacity:0.75;} 50%{transform:scale(1.18); opacity:1;}}
  .voice-demo-line{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:18px; color:var(--gold-bright); opacity:0; position:absolute;}
  .voice-demo-confirm{font-family:'Jost', sans-serif; font-size:14px; color:var(--sage); opacity:0; position:absolute; letter-spacing:0.01em;}
  .voice-demo-clip .line1{animation:voiceFade1 8s ease-in-out infinite;}
  .voice-demo-clip .confirm1{animation:voiceFade2 8s ease-in-out infinite;}
  .voice-demo-clip .line2{animation:voiceFade3 8s ease-in-out infinite;}
  .voice-demo-clip .confirm2{animation:voiceFade4 8s ease-in-out infinite;}
  @keyframes voiceFade1{0%,12.5%{opacity:0;} 18%,35%{opacity:1;} 40%,100%{opacity:0;}}
  @keyframes voiceFade2{0%,38%{opacity:0;} 42%,48%{opacity:1;} 52%,100%{opacity:0;}}
  @keyframes voiceFade3{0%,62.5%{opacity:0;} 68%,85%{opacity:1;} 90%,100%{opacity:0;}}
  @keyframes voiceFade4{0%,88%{opacity:0;} 92%,98%{opacity:1;} 100%{opacity:0;}}

  .small-note{font-size:11px; color:var(--muted-2); margin-top:10px; line-height:1.5;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline-strong); border-radius:4px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"><span class="msg" id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
/* ============================= DATA / DEFAULTS ============================= */
const DEFAULT_INCOME = [
  {id:'inc1', name:'Salary', planned:0},
  {id:'inc2', name:'Investments', planned:0},
  {id:'inc3', name:'Business', planned:0},
  {id:'inc4', name:'Others', planned:0},
];
const DEFAULT_EXPENSE = [
  {id:'exp1', name:'Mortgage / Rent', planned:0},
  {id:'exp2', name:'Car / Transport', planned:0},
  {id:'exp3', name:'Insurance', planned:0},
  {id:'exp4', name:'Household', planned:0},
  {id:'exp5', name:'Dining', planned:0},
  {id:'exp6', name:'Shopping', planned:0},
  {id:'exp7', name:'Grooming', planned:0},
  {id:'exp8', name:'Others', planned:0},
];

const now = new Date();
const CUR_YEAR = String(now.getFullYear());
const CUR_MONTH = now.toISOString().slice(0,7);
const CUR_DATE = now.toISOString().slice(0,10);

// Sourced from sg.finance.yahoo.com currency quotes, August 2026 — see Settings for a per-currency
// link to check the live rate on Yahoo Finance and update it yourself; these are starting defaults,
// not a live feed (rates drift daily and are always yours to edit).
const DEFAULT_CURRENCIES = { SGD: 1, USD: 1.2832, MYR: 0.3259, EUR: 1.4655, GBP: 1.6977, AUD: 0.8959, JPY: 0.0080, CNY: 0.1862 };
const DEFAULT_RATES_AS_OF = 'August 2026';

function defaultState(){
  return {
    goal: { amount: 0, year: CUR_YEAR },
    monthCats: { [CUR_MONTH]: { income: clone(DEFAULT_INCOME), expense: clone(DEFAULT_EXPENSE) } },
    transactions: [], // {id, date, type, categoryId, categoryName, amount, currency, baseAmount, member, note, createdAt}
    bills: [], // {id, name, amount, dueDay, categoryId, notes, lastPaidMonth}
    netWorth: { accounts: [], history: [] }, // accounts: {id,name,type:'asset'|'liability',balance}; history: {id,date,totalAssets,totalLiabilities,netWorth}
    settings: { baseCurrency: 'SGD', currencies: clone(DEFAULT_CURRENCIES), stripeLinks: { monthly: '', annual: '' } },
    household: { members: [{id:'me', name:'Me'}] },
    subscription: { status: 'none', plan: null, trialEndsAt: null, canceledAt: null }, // status: none | trial | active | canceled_trial | canceled
  };
}
// Fill in any fields missing from older saved data (added in later app versions) without wiping existing data.
function migrateState(){
  if(!STATE.bills) STATE.bills = [];
  if(!STATE.netWorth) STATE.netWorth = { accounts: [], history: [] };
  if(!STATE.netWorth.accounts) STATE.netWorth.accounts = [];
  if(!STATE.netWorth.history) STATE.netWorth.history = [];
  if(!STATE.settings) STATE.settings = { baseCurrency: 'SGD', currencies: clone(DEFAULT_CURRENCIES), stripeLinks: {monthly:'', annual:''} };
  if(!STATE.settings.currencies) STATE.settings.currencies = clone(DEFAULT_CURRENCIES);
  if(!STATE.settings.baseCurrency) STATE.settings.baseCurrency = 'SGD';
  if(!STATE.settings.stripeLinks) STATE.settings.stripeLinks = { monthly: '', annual: '' };
  if(!STATE.household) STATE.household = { members: [{id:'me', name:'Me'}] };
  if(!STATE.household.members || !STATE.household.members.length) STATE.household.members = [{id:'me', name:'Me'}];
  if(!STATE.subscription) STATE.subscription = { status: 'none', plan: null, trialEndsAt: null, canceledAt: null };
  const base = STATE.settings.baseCurrency;
  STATE.transactions.forEach(t => {
    if(!t.currency) t.currency = base;
    if(t.baseAmount === undefined || t.baseAmount === null) t.baseAmount = t.amount;
    if(!t.member) t.member = STATE.household.members[0].id;
  });
}
// --- Subscription helpers: local state-machine only. No real charge ever happens here —
// real billing is handled either by Apple/Google's native purchase flow (once published)
// or by a connected Stripe Payment Link (see Settings -> Monetization).
function startTrial(plan){
  STATE.subscription = { status: 'trial', plan, trialEndsAt: Date.now() + 7*24*60*60*1000, canceledAt: null };
  persist();
}
function cancelTrial(){
  STATE.subscription.status = 'canceled_trial';
  STATE.subscription.canceledAt = Date.now();
  persist();
}
function purchaseDirect(plan){
  STATE.subscription = { status: 'active', plan, trialEndsAt: null, canceledAt: null };
  persist();
}
function cancelSubscription(){
  STATE.subscription.status = 'canceled';
  STATE.subscription.canceledAt = Date.now();
  persist();
}
// Combine an imported dataset into the current one without deleting anything on either side.
// Used for household "shared access": each person exports their log, the other imports with Merge.
function mergeState(remote){
  // Ensure remote has the newer fields too, in case it's an older export.
  const remoteBase = (remote.settings && remote.settings.baseCurrency) || 'SGD';
  (remote.transactions||[]).forEach(t => {
    if(!t.currency) t.currency = remoteBase;
    if(t.baseAmount === undefined || t.baseAmount === null) t.baseAmount = t.amount;
    if(!t.member) t.member = 'me';
  });

  // Transactions: union by id.
  const txnMap = {};
  STATE.transactions.forEach(t => txnMap[t.id] = t);
  (remote.transactions||[]).forEach(t => { if(!txnMap[t.id]) txnMap[t.id] = t; });
  STATE.transactions = Object.values(txnMap);

  // Bills: union by id.
  const billMap = {};
  (STATE.bills||[]).forEach(b => billMap[b.id] = b);
  (remote.bills||[]).forEach(b => { if(!billMap[b.id]) billMap[b.id] = b; });
  STATE.bills = Object.values(billMap);

  // Net worth accounts + history: union by id.
  if(!STATE.netWorth) STATE.netWorth = { accounts: [], history: [] };
  const naMap = {}; (STATE.netWorth.accounts||[]).forEach(a => naMap[a.id] = a);
  (remote.netWorth && remote.netWorth.accounts || []).forEach(a => { if(!naMap[a.id]) naMap[a.id] = a; });
  STATE.netWorth.accounts = Object.values(naMap);
  const nwMap = {}; (STATE.netWorth.history||[]).forEach(h => nwMap[h.id] = h);
  (remote.netWorth && remote.netWorth.history || []).forEach(h => { if(!nwMap[h.id]) nwMap[h.id] = h; });
  STATE.netWorth.history = Object.values(nwMap);

  // Household members: union by id (falls back to name match to avoid duplicate "Me" entries).
  const memMap = {}; (STATE.household.members||[]).forEach(m => memMap[m.id] = m);
  const memNames = new Set(STATE.household.members.map(m => m.name.toLowerCase()));
  (remote.household && remote.household.members || []).forEach(m => {
    if(!memMap[m.id] && !memNames.has(m.name.toLowerCase())) memMap[m.id] = m;
  });
  STATE.household.members = Object.values(memMap);

  // Month category templates: only add months that don't exist locally yet (never overwrite local edits).
  Object.keys(remote.monthCats||{}).forEach(m => {
    if(!STATE.monthCats[m]) STATE.monthCats[m] = remote.monthCats[m];
  });

  // Currency rates: fill in any codes we don't already have.
  Object.keys((remote.settings && remote.settings.currencies) || {}).forEach(code => {
    if(STATE.settings.currencies[code] === undefined) STATE.settings.currencies[code] = remote.settings.currencies[code];
  });

  // Goal: only take the imported goal if we don't have one set yet.
  if((!STATE.goal || !STATE.goal.amount) && remote.goal) STATE.goal = remote.goal;

  migrateState();
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// Safely turn any thrown value into a plain string — some sandboxed preview consoles
// throw a DataCloneError when a raw Error/DOMException object is passed to console.warn/error.
function errMsg(e){
  try{
    if(e === undefined || e === null) return 'unknown error';
    if(typeof e === 'string') return e;
    if(e.message) return String(e.message);
    return String(e);
  }catch(_){ return 'unknown error'; }
}

let STATE = defaultState();
let saveTimer = null;
let storageWarningShown = false;
const DB_NAME = 'MyDollarManagerDB';
const DB_STORE = 'kv';
const STORAGE_KEY = 'my-dollar-manager-data';
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return dbPromise;
}
function idbGet(key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(key, value){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).put(value, key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  }));
}
function idbDelete(key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  }));
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await idbSet(STORAGE_KEY, STATE);
    }catch(e){
      console.warn('Save failed — this browser may not support persistent storage: ' + errMsg(e));
      if(!storageWarningShown){
        storageWarningShown = true;
        flashToast('Warning: this browser could not save your data persistently.');
      }
    }
    if(cloud.householdId) pushCloudData();
  }, 250);
}

/* ============================= CLOUD SYNC / HOUSEHOLD ACCOUNTS ============================= */
const CLOUD_CONFIG_KEY = 'cloud-config';
let supaClient = null;
let cloud = {
  configured: false,      // has a Supabase project been connected?
  url: null, anonKey: null,
  authed: false,          // signed in?
  userEmail: null,
  householdId: null, householdName: null, inviteCode: null, displayName: null,
  members: [],
  syncing: false, lastSyncedAt: null,
  authMode: 'login',      // 'login' | 'signup' — which form is showing
  error: null,
};

async function loadCloudConfig(){
  try{
    const cfg = await idbGet(CLOUD_CONFIG_KEY);
    if(cfg && cfg.url && cfg.anonKey){
      cloud.url = cfg.url; cloud.anonKey = cfg.anonKey;
      await connectSupabaseClient(cfg.url, cfg.anonKey, false);
    }
  }catch(e){ /* no cloud config saved yet — that's fine, cloud sync is opt-in */ }
}

async function connectSupabaseClient(url, anonKey, persistConfig){
  if(!window.supabase || !window.supabase.createClient){
    cloud.error = "The cloud library didn't load — check your internet connection and reload the app.";
    render();
    return false;
  }
  try{
    supaClient = window.supabase.createClient(url, anonKey);
    cloud.url = url; cloud.anonKey = anonKey; cloud.configured = true; cloud.error = null;
    if(persistConfig){ await idbSet(CLOUD_CONFIG_KEY, {url, anonKey}); }
    const { data } = await supaClient.auth.getSession();
    if(data && data.session){
      cloud.authed = true;
      cloud.userEmail = data.session.user.email;
      await afterLogin();
    }
    supaClient.auth.onAuthStateChange((event, session) => {
      if(event === 'SIGNED_OUT'){ resetCloudSession(); render(); }
    });
    render();
    return true;
  }catch(e){
    cloud.error = 'Could not connect: ' + errMsg(e);
    render();
    return false;
  }
}

async function cloudSignUp(email, password){
  cloud.error = null;
  try{
    const { data, error } = await supaClient.auth.signUp({ email, password });
    if(error) throw error;
    if(data.session){
      cloud.authed = true; cloud.userEmail = email; await afterLogin();
    }else{
      flashToast('Check your email to confirm your account, then log in.');
      cloud.authMode = 'login';
    }
    render();
  }catch(e){ cloud.error = errMsg(e); render(); }
}
async function cloudLogIn(email, password){
  cloud.error = null;
  try{
    const { data, error } = await supaClient.auth.signInWithPassword({ email, password });
    if(error) throw error;
    cloud.authed = true; cloud.userEmail = email;
    await afterLogin();
    render();
  }catch(e){ cloud.error = errMsg(e); render(); }
}
async function cloudSignOut(){
  try{ if(cloud.realtimeChannel) supaClient.removeChannel(cloud.realtimeChannel); }catch(e){}
  try{ await supaClient.auth.signOut(); }catch(e){}
  resetCloudSession();
  render();
}
function resetCloudSession(){
  cloud.authed = false; cloud.userEmail = null;
  cloud.householdId = null; cloud.householdName = null; cloud.inviteCode = null; cloud.displayName = null;
  cloud.members = []; cloud.realtimeChannel = null;
}

async function afterLogin(){
  try{
    const { data: { session } } = await supaClient.auth.getSession();
    if(!session) return;
    const { data, error } = await supaClient
      .from('household_members')
      .select('household_id, display_name, households(name, invite_code)')
      .eq('user_id', session.user.id)
      .maybeSingle();
    if(error) throw error;
    if(data){
      cloud.householdId = data.household_id;
      cloud.householdName = data.households.name;
      cloud.inviteCode = data.households.invite_code;
      cloud.displayName = data.display_name;
      await pullCloudData();
      await refreshHouseholdMembers();
      subscribeRealtime();
    }
  }catch(e){ console.warn('afterLogin failed: ' + errMsg(e)); }
}

async function cloudCreateHousehold(name, displayName){
  cloud.error = null;
  try{
    const { data, error } = await supaClient.rpc('create_household', { p_name: name, p_display_name: displayName });
    if(error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    cloud.householdId = row.household_id;
    cloud.householdName = name;
    cloud.inviteCode = row.invite_code;
    cloud.displayName = displayName;
    await pushCloudData(); // seed the household with whatever is on this device right now
    await refreshHouseholdMembers();
    subscribeRealtime();
    flashToast('Sharing started — invite code: ' + row.invite_code);
    render();
  }catch(e){ cloud.error = errMsg(e); render(); }
}
async function cloudJoinHousehold(code, displayName){
  cloud.error = null;
  try{
    const { data: hid, error } = await supaClient.rpc('join_household_by_code', { p_code: code, p_display_name: displayName });
    if(error) throw error;
    cloud.householdId = hid;
    cloud.displayName = displayName;
    const { data: h } = await supaClient.from('households').select('name, invite_code').eq('id', hid).maybeSingle();
    if(h){ cloud.householdName = h.name; cloud.inviteCode = h.invite_code; }
    await pullCloudData();
    await refreshHouseholdMembers();
    subscribeRealtime();
    flashToast('Joined household "' + (h ? h.name : '') + '".');
    render();
  }catch(e){ cloud.error = errMsg(e); render(); }
}
async function cloudLeaveHousehold(){
  try{
    if(cloud.realtimeChannel){ supaClient.removeChannel(cloud.realtimeChannel); cloud.realtimeChannel = null; }
    await supaClient.rpc('leave_household', { hid: cloud.householdId });
  }catch(e){ console.warn('leave household failed: ' + errMsg(e)); }
  cloud.householdId = null; cloud.householdName = null; cloud.inviteCode = null; cloud.members = [];
  render();
}

async function refreshHouseholdMembers(){
  if(!cloud.householdId) return;
  try{
    const { data, error } = await supaClient.from('household_members').select('display_name').eq('household_id', cloud.householdId);
    if(!error && data) cloud.members = data.map(m => m.display_name);
  }catch(e){ console.warn('member list fetch failed: ' + errMsg(e)); }
}

async function pullCloudData(){
  if(!cloud.householdId) return;
  try{
    const { data, error } = await supaClient.from('app_data').select('data, updated_at').eq('household_id', cloud.householdId).maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      mergeState(data.data);
      persist();
      render();
    }
  }catch(e){ console.warn('pull failed: ' + errMsg(e)); }
}
async function pushCloudData(){
  if(!cloud.householdId || !supaClient) return;
  cloud.syncing = true;
  try{
    const { data: { session } } = await supaClient.auth.getSession();
    await supaClient.from('app_data').update({
      data: STATE, updated_by: session ? session.user.id : null, updated_at: new Date().toISOString()
    }).eq('household_id', cloud.householdId);
    cloud.lastSyncedAt = Date.now();
  }catch(e){ console.warn('cloud push failed: ' + errMsg(e)); }
  cloud.syncing = false;
}
function subscribeRealtime(){
  if(cloud.realtimeChannel || !cloud.householdId) return;
  try{
    cloud.realtimeChannel = supaClient.channel('household-' + cloud.householdId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'household_id=eq.' + cloud.householdId }, async (payload) => {
        const { data: { session } } = await supaClient.auth.getSession();
        if(session && payload.new.updated_by === session.user.id) return; // ignore echoes of our own writes
        if(payload.new.data && Object.keys(payload.new.data).length){
          mergeState(payload.new.data);
          persist();
          flashToast('Sharing ledger updated.');
          if(ui.tab !== 'account') render(); else render();
        }
      })
      .subscribe();
  }catch(e){ console.warn('realtime subscribe failed: ' + errMsg(e)); }
}


/* ============================= BILLS / RECURRING PAYMENTS ============================= */
function daysUntilDue(dueDay){
  const now = new Date();
  const today = now.getDate();
  return dueDay - today; // negative = overdue this month
}
function isBillPaidThisMonth(bill){
  return bill.lastPaidMonth === CUR_MONTH;
}
function billStatus(bill){
  if(isBillPaidThisMonth(bill)) return 'paid';
  const d = daysUntilDue(bill.dueDay);
  if(d < 0) return 'overdue';
  if(d <= 7) return 'soon';
  return 'upcoming';
}

  if(!bills.length) return '';

  <div class="card">

      </div>
      <div style="text-align:right; margin:4px 0 10px;"><button class="pill-btn" data-action="markBillPaid" data-id="${b.id}">Mark Paid</button></div>

    }).join('')}

}

/* ============================= NET WORTH ============================= */
function netWorthTotals(){
  const accounts = STATE.netWorth.accounts;
  const totalAssets = accounts.filter(a=>a.type==='asset').reduce((s,a)=>s+Number(a.balance||0),0);
  const totalLiabilities = accounts.filter(a=>a.type==='liability').reduce((s,a)=>s+Number(a.balance||0),0);
  return { totalAssets, totalLiabilities, netWorth: totalAssets - totalLiabilities };
}
function renderLineChart(points, color){
  if(points.length < 2){
    return '<div class="empty-state">Save at least two snapshots to see a trend line.</div>';
  }
  const W = 1080, H = 220, padL = 50, padB = 26, padT = 14;
  const chartW = W - padL - 10, chartH = H - padT - padB;
  const values = points.map(p=>p.value);
  const maxVal = Math.max(...values, 0);
  const minVal = Math.min(...values, 0);
  const range = (maxVal - minVal) || 1;
  const stepX = chartW / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = padL + i*stepX;
    const y = padT + chartH - ((p.value - minVal) / range) * chartH;
    return {x, y, ...p};
  });
  const pathD = coords.map((c,i) => (i===0?'M':'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L ${coords[coords.length-1].x.toFixed(1)} ${padT+chartH} L ${coords[0].x.toFixed(1)} ${padT+chartH} Z`;
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="${color}"><title>${c.label}: ${fmt(c.value)}</title></circle>`).join('');
  const labels = coords.filter((c,i) => i===0 || i===coords.length-1 || i===Math.floor(coords.length/2))
    .map(c => `<text x="${c.x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#6d675c" font-family="IBM Plex Mono">${c.label}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
    <defs>
      <linearGradient id="nwFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaD}" fill="url(#nwFill)"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}
    ${labels}
  </svg>`;
}
function renderNetWorth(){
  const accounts = STATE.netWorth.accounts;
  const totals = netWorthTotals();
  const history = STATE.netWorth.history.slice().sort((a,b) => a.date.localeCompare(b.date));

/* find the most recent month (chronologically <= target) that has data, to use as a template */
function latestTemplateBefore(month){
  const keys = Object.keys(STATE.monthCats).filter(k => k <= month).sort();
  if(keys.length) return STATE.monthCats[keys[keys.length-1]];
  const anyKeys = Object.keys(STATE.monthCats).sort();
  if(anyKeys.length) return STATE.monthCats[anyKeys[0]];
  return { income: clone(DEFAULT_INCOME), expense: clone(DEFAULT_EXPENSE) };
}
function ensureMonth(month){
  if(!STATE.monthCats[month]){
    const tmpl = latestTemplateBefore(month);
    STATE.monthCats[month] = clone(tmpl);
    persist();
  }
  return STATE.monthCats[month];
}
function applyTemplateToMonth(month, sourceMonth){
  const src = STATE.monthCats[sourceMonth];
  if(!src) return;
  STATE.monthCats[month] = clone(src);
  persist();
}

const CURRENCY_SYMBOLS = { SGD:'S$', USD:'US$', MYR:'RM', EUR:'€', GBP:'£', AUD:'A$', JPY:'¥', CNY:'¥' };
function currencySymbol(code){ return CURRENCY_SYMBOLS[code] || (code ? code + ' ' : 'S$'); }
function fmt(n, currency){
  const cur = currency || (STATE.settings && STATE.settings.baseCurrency) || 'SGD';
  n = Math.round((n + Number.EPSILON) * 100) / 100;
  const isInt = Math.abs(n % 1) < 0.001;
  const opts = isInt ? {maximumFractionDigits:0} : {maximumFractionDigits:2, minimumFractionDigits:2};
  const sign = n < 0 ? '-' : '';
  return sign + currencySymbol(cur) + Math.abs(n).toLocaleString('en-US', opts);
}
function monthLabel(m){
  const [y,mo] = m.split('-');
  const d = new Date(parseInt(y), parseInt(mo)-1, 1);
  return d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
}
function monthShort(m){
  const [y,mo] = m.split('-');
  const d = new Date(parseInt(y), parseInt(mo)-1, 1);
  return d.toLocaleDateString('en-US', {month:'short'});
}
function txnAmt(t){ return (t.baseAmount !== undefined && t.baseAmount !== null) ? t.baseAmount : t.amount; }
function txnsForMonth(month){
  return STATE.transactions.filter(t => t.date.slice(0,7) === month);
}
function totalsForMonth(month){
  const txns = txnsForMonth(month);
  const income = txns.filter(t=>t.type==='income').reduce((s,t)=>s+txnAmt(t),0);
  const expense = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+txnAmt(t),0);
  return {income, expense, net: income-expense};
}
function ytdSavings(year){
  const txns = STATE.transactions.filter(t => t.date.slice(0,4) === year);
  const income = txns.filter(t=>t.type==='income').reduce((s,t)=>s+txnAmt(t),0);
  const expense = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+txnAmt(t),0);
  return {income, expense, net: income-expense};
}
function actualByCategory(month, type){
  const txns = txnsForMonth(month).filter(t=>t.type===type);
  const map = {};
  txns.forEach(t => { map[t.categoryId] = (map[t.categoryId]||0) + txnAmt(t); });
  return map;
}

function yearProgressPct(year){
  const y = parseInt(year, 10);
  if(isNaN(y)) return 0;
  const start = new Date(y, 0, 1).getTime();
  const end = new Date(y+1, 0, 1).getTime();
  const now = Date.now();
  const clampedNow = Math.min(Math.max(now, start), end);
  return ((clampedNow - start) / (end - start)) * 100;
}

function goalMotivationMessage(pct){
  if(pct <= 0) return 'Go ahead, enter your Income / Expenses';
  if(pct > 80) return "You're on a roll! Almost there…";
  if(pct > 50) return "You're more than halfway there. Keep going!";
  return "Keep going. You've got this!";
}

function renderRingGauge(pctRaw, color, title, sublabel){
  const size = 168, stroke = 13, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, pctRaw));
  const offset = c - (pct/100) * c;
  const displayPct = Math.round(pctRaw);
  return `
  <div style="text-align:center;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1b1a20" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s ease;"/>
      <text x="${size/2}" y="${size/2-2}" text-anchor="middle" font-family="Cormorant Garamond" font-size="30" font-weight="700" fill="#f2ede2">${displayPct}%</text>
      <text x="${size/2}" y="${size/2+18}" text-anchor="middle" font-family="Jost" font-size="9.5" letter-spacing="1" fill="#9c9587">${escapeHtml(sublabel||'')}</text>
    </svg>
    <div style="font-family:'Cormorant Garamond', serif; font-size:15.5px; color:var(--gold-bright); margin-top:8px; font-weight:600; letter-spacing:0.02em;">${escapeHtml(title)}</div>
  </div>`;
}

function renderDemoBarChart(){
  const W=460, H=220, padL=40, padB=26, padT=10;
  const chartW=W-padL-10, chartH=H-padT-padB;
  const maxVal = Math.max(...DEMO_TREND.map(d=>Math.max(d.income,d.expense)));
  const groupW = chartW/DEMO_TREND.length;
  const barW = Math.min(30, groupW*0.3);
  let bars='';
  DEMO_TREND.forEach((d,i) => {
    const gx = padL + i*groupW + groupW/2;
    const incH = (d.income/maxVal)*chartH, expH=(d.expense/maxVal)*chartH;
    bars += `<rect x="${gx-barW-3}" y="${padT+chartH-incH}" width="${barW}" height="${incH}" rx="3" fill="#5ac8fa"/>`;
    bars += `<rect x="${gx+3}" y="${padT+chartH-expH}" width="${barW}" height="${expH}" rx="3" fill="#ff6fa5"/>`;
    bars += `<text x="${gx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#9c9587" font-family="IBM Plex Mono">${DEMO_MONTHS[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}
// Generic donut chart renderer (colorful, used by Intro + Demo marketing tabs)
function renderIESPieGeneric(slices, centerLabel){
  const total = slices.reduce((s,x)=>s+x.value,0);
  const cx=140, cy=140, r=110, rInner=62;
  let angle=-90, paths='';
  slices.forEach(s => {
    const frac = s.value/total, sweep = frac*360, large = sweep>180?1:0;
    const a0=angle*Math.PI/180, a1=(angle+sweep)*Math.PI/180;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const xi0=cx+rInner*Math.cos(a1), yi0=cy+rInner*Math.sin(a1);
    const xi1=cx+rInner*Math.cos(a0), yi1=cy+rInner*Math.sin(a0);
    paths += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi0} ${yi0} A ${rInner} ${rInner} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${s.color}" stroke="#0a0a0c" stroke-width="1.5"><title>${escapeHtml(s.name)}: ${fmt(s.value)}</title></path>`;
    angle += sweep;
  });
  const legend = slices.map(s => `<div class="legend-item"><span class="legend-swatch" style="background:${s.color};"></span>${escapeHtml(s.name)} — ${(s.value/total*100).toFixed(0)}%</div>`).join('');
  return `
  <svg viewBox="0 0 280 280" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    ${paths}
    <text x="140" y="134" text-anchor="middle" font-family="Cormorant Garamond" font-size="18" fill="#f2ede2" font-weight="600">${fmt(total)}</text>
    <text x="140" y="152" text-anchor="middle" font-family="Jost" font-size="9.5" fill="#9c9587" letter-spacing="1">${escapeHtml(centerLabel||'TOTAL')}</text>
  </svg>
  <div class="legend" style="justify-content:center;">${legend}</div>`;
}

function renderIESPie(income, expense, savings){
  const total = income + expense + savings;
  const slices = [
    {name:'Income', value:income, color:'#ff9f43'},
    {name:'Expenses', value:expense, color:'#ff5c5c'},
    {name:'Savings', value:savings, color:'#6fe08a'},
  ].filter(s => s.value > 0);
  const cx=140, cy=140, r=110, rInner=62;
  let angle = -90;
  let paths = '';
  slices.forEach(s => {
    const frac = s.value/total;
    const sweep = frac*360;
    const large = sweep>180?1:0;
    const a0 = angle * Math.PI/180;
    const a1 = (angle+sweep) * Math.PI/180;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const xi0 = cx + rInner*Math.cos(a1), yi0 = cy + rInner*Math.sin(a1);
    const xi1 = cx + rInner*Math.cos(a0), yi1 = cy + rInner*Math.sin(a0);
    paths += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi0} ${yi0} A ${rInner} ${rInner} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${s.color}" stroke="#0a0a0c" stroke-width="1.5"><title>${s.name}: ${fmt(s.value)} (${(frac*100).toFixed(1)}%)</title></path>`;
    angle += sweep;
  });
  const legend = slices.map(s => {
    const frac = (s.value/total*100).toFixed(1);
    return `<div class="legend-item"><span class="legend-swatch" style="background:${s.color};"></span>${s.name} — ${frac}%</div>`;
  }).join('');
  return `
  <svg viewBox="0 0 280 280" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    ${paths}
    <text x="140" y="134" text-anchor="middle" font-family="Cormorant Garamond" font-size="18" fill="#f2ede2" font-weight="600">${fmt(total)}</text>
    <text x="140" y="152" text-anchor="middle" font-family="Jost" font-size="9.5" fill="#9c9587" letter-spacing="1">COMBINED TOTAL</text>
  </svg>
  <div class="legend" style="justify-content:center;">${legend}</div>
  <div class="small-note" style="text-align:center;">Savings is floored at S$0 for this chart when net YTD is negative.</div>
  `;
}


function renderTrendChart(months, data, maxVal){
  const W = 1080, H = 260, padL = 40, padB = 26, padT = 10;
  const chartW = W - padL - 10, chartH = H - padT - padB;
  const groupW = chartW / months.length;
  const barW = Math.min(16, groupW*0.32);
  let bars = '';
  months.forEach((m,i) => {
    const gx = padL + i*groupW + groupW/2;
    const incH = (data[i].income / maxVal) * chartH;
    const expH = (data[i].expense / maxVal) * chartH;
    const incX = gx - barW - 2;
    const expX = gx + 2;
    bars += `<rect x="${incX}" y="${padT+chartH-incH}" width="${barW}" height="${Math.max(incH,0)}" rx="2" fill="url(#goldGrad)"><title>${monthShort(m)} Income: ${fmt(data[i].income)}</title></rect>`;
    bars += `<rect x="${expX}" y="${padT+chartH-expH}" width="${barW}" height="${Math.max(expH,0)}" rx="2" fill="url(#rustGrad)"><title>${monthShort(m)} Expense: ${fmt(data[i].expense)}</title></rect>`;
    bars += `<text x="${gx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="#6d675c" font-family="IBM Plex Mono">${monthShort(m)}</text>`;
  });
  // gridlines
  let grid = '';
  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (g/4)*chartH;
    grid += `<line x1="${padL}" y1="${gy}" x2="${W-10}" y2="${gy}" stroke="rgba(201,162,75,0.12)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${gy+3}" text-anchor="end" font-size="9.5" fill="#6d675c" font-family="IBM Plex Mono">${fmt((maxVal*g/4)).replace('S$','')}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e9cd82"/><stop offset="100%" stop-color="#a8813a"/>
      </linearGradient>
      <linearGradient id="rustGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d17155"/><stop offset="100%" stop-color="#8a4b36"/>
      </linearGradient>
    </defs>
    ${grid}
    ${bars}
  </svg>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// True only when this code is running inside a native iOS app shell (e.g. wrapped with Capacitor),
// never when running as a plain website or installed PWA. Apple's Guideline 3.1.1 prohibits linking
// out to external payment pages (like Stripe) to unlock in-app subscriptions — so the Stripe checkout
// path must be hidden here and only used on the web/PWA version sold outside the App Store.
function isNativeIOSApp(){
  try{
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios');

}

function renderPieChart(cats){
  const total = cats.reduce((s,c)=>s+c.value,0);
  const cx=140, cy=140, r=110, rInner=62;
  let angle = -90;
  let paths = '';
  cats.forEach((c,i) => {
    const frac = c.value/total;
    const sweep = frac*360;
    const large = sweep>180?1:0;
    const a0 = angle * Math.PI/180;
    const a1 = (angle+sweep) * Math.PI/180;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const xi0 = cx + rInner*Math.cos(a1), yi0 = cy + rInner*Math.sin(a1);
    const xi1 = cx + rInner*Math.cos(a0), yi1 = cy + rInner*Math.sin(a0);
    const color = PIE_COLORS[i % PIE_COLORS.length];
    paths += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi0} ${yi0} A ${rInner} ${rInner} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${color}" stroke="#0a0a0c" stroke-width="1.5"><title>${escapeHtml(c.name)}: ${fmt(c.value)} (${(frac*100).toFixed(1)}%)</title></path>`;
    angle += sweep;
  });
  const legend = cats.map((c,i) => {
    const frac = (c.value/total*100).toFixed(1);
    return `<div class="legend-item"><span class="legend-swatch" style="background:${PIE_COLORS[i%PIE_COLORS.length]};"></span>${escapeHtml(c.name)} — ${frac}%</div>`;
  }).join('');
  return `
  <svg viewBox="0 0 280 280" style="width:100%; max-width:280px; display:block; margin:0 auto;">
    ${paths}
    <text x="140" y="134" text-anchor="middle" font-family="Cormorant Garamond" font-size="20" fill="#f2ede2" font-weight="600">${fmt(total)}</text>
    <text x="140" y="152" text-anchor="middle" font-family="Jost" font-size="10" fill="#9c9587" letter-spacing="1">TOTAL SPENT</text>
  </svg>
  <div class="legend" style="justify-content:center;">${legend}</div>
  `;
}

function renderCheckout(){

  const sub = STATE.subscription;
  const stripeLink = STATE.settings.stripeLinks ? STATE.settings.stripeLinks[plan] : '';

  if(sub.status === 'trial'){

    return `

/* ============================= EVENT HANDLING ============================= */
function attachGlobalHandlers(){
  // tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { ui.tab = btn.dataset.tab; render(); });
  });

  // generic in-content navigation links (used on Intro/Demo/Trial/Pricing/Terms/Privacy)
  document.querySelectorAll('[data-action=goToTab]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      ui.tab = el.dataset.tab;
      const anchor = el.dataset.anchor;
      render();
      if(anchor){
        setTimeout(() => {
          const target = document.getElementById(anchor);
          if(target && typeof target.scrollIntoView === 'function') target.scrollIntoView({behavior:'smooth', block:'start'});
        }, 50);
      }
    });
  });

  if(ui.tab === 'intro'){
    const getStartedBtn = document.getElementById('introGetStartedBtn');
    if(getStartedBtn) getStartedBtn.addEventListener('click', () => { ui.tab = 'overview'; render(); });
    const seeDemoBtn = document.getElementById('introSeeDemoBtn');
    if(seeDemoBtn) seeDemoBtn.addEventListener('click', () => { ui.tab = 'demo'; render(); });
    const tryFreeBtn = document.getElementById('introTryFreeBtn');
    if(tryFreeBtn) tryFreeBtn.addEventListener('click', () => { ui.tab = 'trial'; render(); });
    const viewPlansBtn = document.getElementById('introViewPlansBtn');
    if(viewPlansBtn) viewPlansBtn.addEventListener('click', () => { ui.tab = 'pricing'; render(); });
  }

  if(ui.tab === 'demo'){
    const demoTryFreeBtn = document.getElementById('demoTryFreeBtn');
    if(demoTryFreeBtn) demoTryFreeBtn.addEventListener('click', () => { ui.tab = 'trial'; render(); });
  }

  if(ui.tab === 'trial'){
    document.querySelectorAll('[data-action=setPlan]').forEach(btn => {
      btn.addEventListener('click', () => { ui.selectedPlan = btn.dataset.plan; render(); });
    });
    const startTrialFlowBtn = document.getElementById('startTrialFlowBtn');
    if(startTrialFlowBtn) startTrialFlowBtn.addEventListener('click', () => {
      ui.trialFlow = true; ui.tab = 'checkout'; render();
    });
    const trialViewPlansBtn = document.getElementById('trialViewPlansBtn');
    if(trialViewPlansBtn) trialViewPlansBtn.addEventListener('click', () => { ui.tab = 'pricing'; render(); });
  }

  if(ui.tab === 'pricing'){
    document.querySelectorAll('[data-action=selectPlanFromPricing]').forEach(btn => {
      btn.addEventListener('click', () => {
        ui.selectedPlan = btn.dataset.plan; ui.trialFlow = false; ui.tab = 'checkout'; render();
      });
    });
  }

  if(ui.tab === 'checkout'){
    const goToStripeBtn = document.getElementById('goToStripeBtn');
    if(goToStripeBtn) goToStripeBtn.addEventListener('click', () => {
      const link = STATE.settings.stripeLinks[ui.selectedPlan || 'annual'];
      if(link) window.open(link, '_blank', 'noopener,noreferrer');
    });
    const simulateStartBtn = document.getElementById('simulateStartBtn');
    if(simulateStartBtn) simulateStartBtn.addEventListener('click', () => {
      if(ui.trialFlow){ startTrial(ui.selectedPlan || 'annual'); flashToast('Free trial started (preview) — no real charge occurred.'); }
      else{ purchaseDirect(ui.selectedPlan || 'annual'); flashToast('Subscription activated (preview) — no real charge occurred.'); }
      render();
    });
    const cancelTrialBtn = document.getElementById('cancelTrialBtn');
    if(cancelTrialBtn) cancelTrialBtn.addEventListener('click', () => {
      if(!confirm('Cancel your free trial? You will not be charged.')) return;
      cancelTrial(); flashToast('Trial canceled — you will not be charged.'); render();
    });
    const cancelSubBtn = document.getElementById('cancelSubBtn');
    if(cancelSubBtn) cancelSubBtn.addEventListener('click', () => {
      if(!confirm('Cancel your subscription?')) return;
      cancelSubscription(); flashToast('Subscription canceled.'); render();
    });
  }

  if(ui.showOnboarding){
    const skipBtn = document.getElementById('onboardSkipBtn');
    if(skipBtn) skipBtn.addEventListener('click', () => markOnboardingSeen());
    const backBtn = document.getElementById('onboardBackBtn');
    if(backBtn) backBtn.addEventListener('click', () => { ui.onboardingStep = Math.max(0, ui.onboardingStep - 1); render(); });
    const nextBtn = document.getElementById('onboardNextBtn');
    if(nextBtn) nextBtn.addEventListener('click', () => {
      if(ui.onboardingStep >= ONBOARDING_SLIDES.length - 1){ markOnboardingSeen(); }
      else { ui.onboardingStep += 1; render(); }
    });
  }

  if(ui.tab === 'overview'){
    const editBtn = document.getElementById('editGoalBtn');
    if(editBtn) editBtn.addEventListener('click', () => {
      const box = document.getElementById('goalEditBox');
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    });
    const saveGoalBtn = document.getElementById('saveGoalBtn');
    if(saveGoalBtn) saveGoalBtn.addEventListener('click', () => {
      const amt = parseFloat(document.getElementById('goalAmountInput').value) || 0;
      const yr = document.getElementById('goalYearInput').value.trim() || CUR_YEAR;
      STATE.goal.amount = amt;
      STATE.goal.year = yr;
      persist();
      render();
    });
  }

  if(ui.tab === 'add'){
    document.querySelectorAll('[data-action=setAddType]').forEach(btn => {
      btn.addEventListener('click', () => { ui.addType = btn.dataset.type; render(); });
    });
    const submitBtn = document.getElementById('submitEntryBtn');
    if(submitBtn) submitBtn.addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('amountInput').value);
      const categoryId = document.getElementById('categorySelect').value;
      const date = document.getElementById('dateInput').value || CUR_DATE;
      const note = document.getElementById('noteInput').value.trim();
      const currencyEl = document.getElementById('currencySelect');
      const currency = currencyEl ? currencyEl.value : STATE.settings.baseCurrency;
      const memberEl = document.getElementById('memberSelect');
      const member = memberEl ? memberEl.value : STATE.household.members[0].id;
      if(!amount || amount <= 0){ flashToast('Enter a valid amount first.'); return; }
      addTransaction({type: ui.addType, categoryId, date, amount, note, currency, member});
      render();
    });
    const micBtn = document.getElementById('micBtn');
    if(micBtn) micBtn.addEventListener('click', toggleVoiceInput);
  }

  // deleteTxn can appear on both the Add Entry (recent list) and Transactions tabs
  document.querySelectorAll('[data-action=deleteTxn]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.transactions = STATE.transactions.filter(t => t.id !== btn.dataset.id);
      persist(); render();
    });
  });

  if(ui.tab === 'transactions'){
    const txnMonthSel = document.getElementById('txnMonthSelect');
    if(txnMonthSel) txnMonthSel.addEventListener('change', (e) => { ui.txnMonth = e.target.value; render(); });

function autoGrowTextarea(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}
function findCat(type, id){
  return STATE.monthCats[ui.entryMonth][type].find(c => c.id === id);
}

function currencyRate(code){
  const rates = STATE.settings.currencies;
  if(code === STATE.settings.baseCurrency) return 1;
  return rates[code] !== undefined ? rates[code] : 1;
}
function toBaseAmount(amount, currency){
  return Math.round(amount * currencyRate(currency) * 100) / 100;
}

function addTransaction({type, categoryId, date, amount, note, currency, member}){
  const month = date.slice(0,7);
  ensureMonth(month);
  const cat = STATE.monthCats[month][type].find(c => c.id === categoryId) || STATE.monthCats[month][type][0];
  const cur = currency || STATE.settings.baseCurrency;
  const memberId = member || (STATE.household.members[0] && STATE.household.members[0].id) || 'me';
  const roundedAmount = Math.round(amount*100)/100;
  const txn = {
    id: uid('t'), date, type, categoryId: cat.id, categoryName: cat.name,
    amount: roundedAmount, currency: cur, baseAmount: toBaseAmount(roundedAmount, cur),
    member: memberId, note: note||'', createdAt: Date.now()
  };
  STATE.transactions.push(txn);
  ui.lastAddedId = txn.id;
  persist();
  return txn;
}

  const toast = document.getElementById('toast');

let recognition = null;
// iOS Safari has a long-standing WebKit bug where Speech Recognition silently does nothing
// when the site is running as an installed Home Screen app (standalone mode) — it works fine
// in a normal Safari tab. We can't fix Apple's bug, only detect it and explain it clearly.
function isIOSStandalonePWA(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  return isIOS && isStandalone;
}
function voiceErrorMessage(err){
  switch(err){
    case 'not-allowed':
    case 'permission-denied':
      return 'Microphone access is blocked. Check the site permissions (tap the icon left of the address bar in Chrome) and allow microphone access for this page, then try again. On Android, also check Chrome has microphone permission at the OS level: Settings → Apps → Chrome → Permissions → Microphone.';
    case 'no-speech':
      return "Didn't catch any speech — try again, a bit closer to the mic.";
    case 'audio-capture':
      return 'No microphone was found on this device.';
    case 'network':
      return "Chrome's voice recognition needs to reach Google's servers over the internet — check your connection, or that nothing (like a VPN, firewall, or ad blocker) is blocking it.";
    case 'service-not-allowed':
      return "Chrome's speech recognition service refused the request — this can happen if the site is loaded inside an embedded frame/preview without microphone permission granted to that frame, or if Chrome's speech service is restricted by an enterprise/device policy.";
    case 'aborted':
      return null; // user-initiated stop, no need to show an error
    default:
      return `Voice input failed (error: "${err || 'unknown'}"). Please share this exact error code so it can be looked into.`;
  }
}
async function toggleVoiceInput(){
  // Native app path (Capacitor on iOS/Android): the browser Web Speech API silently doesn't
  // work inside a packaged app's WKWebView/WebView, so use the native plugin instead when present.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    return toggleNativeVoiceInput();
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ flashToast('Voice input is not supported in this browser. Try Chrome or Safari.'); return; }
  if(window.isSecureContext === false){
    flashToast("Voice input needs a secure (https) connection — it won't work when this file is opened directly. Host it online or install it as an app, then try again.");
    return;
  }
  if(isIOSStandalonePWA()){
    flashToast("Voice input has a known Apple/Safari bug when this app is added to your Home Screen — it works fine when opened directly in Safari. Open this app's link in Safari instead of tapping its Home Screen icon, or type the entry instead.");
    return;
  }
  if(ui.listening){ if(recognition) recognition.stop(); return; }
  if(recognition){ try{ recognition.abort(); }catch(e){} } // clear any stuck instance from a prior attempt

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { ui.listening = true; render(); };
  recognition.onend = () => { ui.listening = false; render(); };
  recognition.onerror = (event) => {
    ui.listening = false;
    console.error('SpeechRecognition error:', event && event.error, event);
    const msg = voiceErrorMessage(event && event.error);
    if(msg) flashToast(msg);
    render();
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    handleVoiceTranscript(transcript);
  };
  try{
    recognition.start();
  }catch(e){
    ui.listening = false;
    flashToast('Could not start voice input — try again.');
    render();
  }
}

// Native path — uses the @capacitor-community/speech-recognition plugin, which wraps
// SFSpeechRecognizer on iOS and Android's SpeechRecognizer, both of which work correctly
// inside a packaged app (unlike the browser Web Speech API in a WKWebView/WebView).
async function toggleNativeVoiceInput(){
  const plugin = window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
  if(!plugin){ flashToast('Voice input plugin not available in this build.'); return; }
  if(ui.listening){ try{ await plugin.stop(); }catch(e){} ui.listening = false; render(); return; }
  try{
    const avail = await plugin.available();
    if(!avail || !avail.available){ flashToast('Voice input is not available on this device.'); return; }
    const perm = await plugin.requestPermission();
    const granted = perm && (perm.speechRecognition === 'granted' || perm.permission === true);
    if(!granted){
      flashToast('Microphone/speech permission was denied. Enable it in your device Settings for this app, then try again.');
      return;
    }
    ui.listening = true; render();
    const result = await plugin.start({ language: 'en-US', maxResults: 1, partialResults: false, popup: false });
    ui.listening = false;
    const transcript = result && result.matches && result.matches[0];
    if(transcript) handleVoiceTranscript(transcript);
    else flashToast("Didn't catch any speech — try again.");
    render();
  }catch(e){
    ui.listening = false;
    console.error('Native speech recognition error:', e);
    flashToast('Voice input failed: ' + errMsg(e));
    render();
  }
}

// Fuzzy-ish matching: exact word match, or one word is a prefix of the other (handles
// "dinner" matching category word "dine", "groceries" matching "grocery", etc).
function wordsRelate(a, b){
  if(a.length < 3 || b.length < 3) return a === b;
  return a === b || a.startsWith(b) || b.startsWith(a);
}
function categoryMatchScore(category, lowerTranscript){
  let score = 0;
  const nameWords = category.name.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2);
  const transcriptWords = lowerTranscript.split(/[^a-z0-9]+/).filter(w => w.length > 2);
  nameWords.forEach(cw => { transcriptWords.forEach(tw => { if(wordsRelate(cw, tw)) score += 1; }); });

  // Voice Keywords are aliases the user defines per category (e.g. "Ma" -> "mum, mother, allowance") —
  // weighted higher since they're a deliberate, user-confirmed signal.
  const aliasRaw = (category.voiceKeywords || '').toLowerCase();
  if(aliasRaw.trim()){
    aliasRaw.split(/[,;]+/).map(s => s.trim()).filter(Boolean).forEach(alias => {
      if(alias.length > 2 && lowerTranscript.includes(alias)){ score += 3; return; }
      alias.split(/\s+/).filter(w => w.length > 2).forEach(aw => {
        transcriptWords.forEach(tw => { if(wordsRelate(aw, tw)) score += 2; });
      });
    });
  }
  return score;
}

function handleVoiceTranscript(transcript){
  const lower = transcript.toLowerCase();
  const amountMatch = lower.match(/(\d+(\.\d{1,2})?)/);
  if(!amountMatch){ flashToast(`Didn't catch an amount in: "${transcript}"`); return; }
  const amount = parseFloat(amountMatch[1]);

  // Respect whichever Income/Expense toggle is already selected on the form — voice fills in
  // the amount/category/note, it does not silently override the type you explicitly chose.
  const type = ui.addType;

  const month = ui.entryMonth || CUR_MONTH;
  ensureMonth(month);
  const cats = STATE.monthCats[month][type];

  let best = null, bestScore = 0;
  cats.forEach(c => {
    const score = categoryMatchScore(c, lower);
    if(score > bestScore){ bestScore = score; best = c; }
  });
  const matched = !!best;
  if(!best){
    best = cats.find(c => c.name.toLowerCase().includes('tba')) || cats[0];
  }

  // strip the amount + filler words to make a note
  let note = transcript.replace(amountMatch[0], '').replace(/dollars?/gi,'').trim();
  note = note.replace(/^(on|for|of)\s+/i,'').trim();

  const date = document.getElementById('dateInput') ? (document.getElementById('dateInput').value || CUR_DATE) : CUR_DATE;
  const txn = addTransaction({type, categoryId: best.id, date, amount, note});
  render();
  if(matched){
    flashToast(`Recorded ${type==='income'?'+':'−'}${fmt(amount)} · ${best.name} · ${date}`, txn.id);
  }else{
    flashToast(`Recorded under "${best.name}" — no confident category match. Add Voice Keywords to a category (Categories tab) to improve this.`, txn.id);
  }
}


/* ============================= INIT ============================= */
loadState();
loadCloudConfig();
</script>
